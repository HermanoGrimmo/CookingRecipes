[www]
; Ping-Endpunkt für den Container-Healthcheck (siehe compose.prod.yaml)
ping.path = /ping
ping.response = pong

; Prozessverwaltung, ausgelegt auf einen kleinen VPS (2 vCPU, 2–4 GB RAM).
; Faustregel: max_children * memory_limit (256M) muss in den RAM passen.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Worker regelmäßig neu starten, um Speicherfragmentierung vorzubeugen
pm.max_requests = 500

; Zugriffs- und Fehlerlogs des Pools nach stderr, damit Docker sie einsammelt
catch_workers_output = yes
decorate_workers_output = no
