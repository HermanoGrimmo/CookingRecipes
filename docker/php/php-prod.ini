[PHP]
; Produktions-Overrides zu app.ini (docker/php/php.ini).
; Wird als zzz-app-prod.ini eingebunden und damit nach app.ini geladen.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Session-Cookies nur über HTTPS ausliefern – TLS terminiert der Proxy davor
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Symfony greift auf sehr viele Dateien zu – größerer Realpath-Cache lohnt sich
realpath_cache_size = 4096k
realpath_cache_ttl = 600
