server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # TLS wird vom vorgelagerten Proxy (Traefik, Caddy, nginx auf dem Host)
    # terminiert, hier läuft nur HTTP im internen Docker-Netz.

    # Muss zu upload_max_filesize/post_max_size in der php.ini passen
    client_max_body_size 32M;

    # Sicherheits-Header. Achtung: add_header wird in verschachtelten
    # location-Blöcken nicht vererbt, sobald dort ein eigenes add_header steht.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Healthcheck ohne PHP-Roundtrip
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Symfony-Standard: alle Anfragen an index.php weiterleiten
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM über den Docker-internen Hostnamen ansprechen
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
        # Sicherheit: nur index.php ist Einstiegspunkt
        internal;
    }

    # Alle anderen .php-Dateien direkt blockieren
    location ~ \.php$ {
        return 404;
    }

    # Encore vergibt in Produktion gehashte Dateinamen (enableVersioning),
    # deshalb kann hier dauerhaft gecacht werden.
    # Kein "expires" zusätzlich zu "add_header Cache-Control", sonst sendet
    # nginx den Header doppelt.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # Versteckte Dateien nicht ausliefern (.env, .git, ...)
    location ~ /\. {
        deny all;
    }
}
